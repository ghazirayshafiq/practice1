apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-practice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ghazirayshafiq/practice1.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: {}